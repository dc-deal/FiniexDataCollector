# FiniexDataCollector Docker Compose
# ===================================

services:
  collector:
    build: .
    container_name: finiex-data-collector
    restart: "no" 
    volumes:
      # Application code (for development)
      - .:/app
      # Named volume for the root home. The editor server lives in
      # /root/.vscode-server, so without this every rebuild re-downloads every
      # extension listed in .devcontainer/devcontainer.json - slow, and it fails
      # outright without network. Shell history survives with it.
      # The ~/.claude bind below sits INSIDE this volume and wins for that path:
      # transcripts belong on the host, where the backup can reach them.
      - devhome:/root
      # Persistent data storage
      - ./data:/app/data
      # Configuration
      - ./configs:/app/configs
      # Logs
      - ./logs:/app/logs
      # Output for transfer
      - ./output:/app/output
      # Developer tool state — Claude Code session transcripts and shell history. Without
      # this mount a container rebuild deletes every session, silently and with no prompt.
      - ~/.claude:/root/.claude
      # Cross-project conversation bus — a sibling host folder shared with the other Finiex
      # projects. Indirected through a variable so this public file carries no private path,
      # and defaulted to a tracked empty stub so a clone without the folder mounts something
      # harmless instead of Docker materialising a root-owned directory beside the checkout.
      # `:-` not `-`: an EMPTY value (as shipped in .env.example) must fall back too.
      - ${FINIEX_BUS_PATH:-./.devcontainer/bus_placeholder}:/bus
    environment:
      - PYTHONPATH=/app
      - TZ=UTC
    command: tail -f /dev/null

volumes:
  # Survives `docker compose down` and a rebuild; removed only by
  # `docker compose down -v`, which is what makes that flag worth hesitating over.
  devhome:
