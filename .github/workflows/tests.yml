# Run the suite on every push, on both platforms this project actually meets.
#
# The matrix is the point, not thoroughness for its own sake. Development happens in a Linux
# container and production is Windows Server, and this project has already been bitten by the
# gap twice: a path assumption that only holds on POSIX, and a console encoding that only
# matters on Windows. A suite that is green on one of the two says less than it looks like.
#
# Location: .github/workflows/tests.yml

name: tests

on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch makes the first run pointless - let it go rather than pay
# for it twice.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    strategy:
      # Both results are wanted. Stopping the Windows job because Linux failed would hide the
      # platform difference this matrix exists to surface.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The version production actually runs, measured on the server 2026-09-17 and not
          # assumed: 3.14.2. Four were in play that day - the Dockerfile pinned 3.12, CI ran
          # 3.13, the development laptop had 3.13.7 - and CI was proving a version nobody ran,
          # which is the blind spot the sister project names in its own workflow.
          python-version: "3.14"
          cache: pip

      # requirements.txt whole, rather than a slimmer test-only list. A second list is a second
      # thing to keep in step, and this install is also the check that `finiex-auth` still
      # resolves over git+https - the dependency that cannot be repaired on a deployment day.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the suite
        # The live display carries box drawing and emoji; without this a cp1252 console
        # truncates output and can kill a piped run outright. Set here for the same reason the
        # start script sets it on the server.
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q
